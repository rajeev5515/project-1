<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustVault</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">TrustVault</div>
    <nav id="nav" hidden>
      <a href="#/documents" data-nav="documents">Documents</a>
      <a href="#/upload" data-nav="upload" data-role="owner">Upload</a>
      <a href="#/trash" data-nav="trash" data-role="owner">Trash</a>
      <a href="#/admin" data-nav="admin" data-role="admin">Admin</a>
    </nav>
    <div id="whoami" class="whoami" hidden>
      <span id="whoami-name"></span>
      <span id="whoami-role" class="pill"></span>
      <a href="#/password">Password</a>
      <button id="logout" type="button" class="link">Sign out</button>
    </div>
  </header>
  <div id="flash" class="flash" role="status" aria-live="polite" hidden></div>
  <main id="view"></main>
  <footer class="foot">Every access decision is made by the server and recorded in a tamper-evident audit trail.</footer>
</body>
</html>
