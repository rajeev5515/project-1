# Fly.io config for the live demo app (generated by Fly Launch, kept in sync here).
# Secrets are NOT in this file. Set them once:
#   fly secrets set TV_MASTER_KEY=$(openssl rand -hex 32) TV_AUDIT_KEY=$(openssl rand -hex 32) \
#                   TV_PUBLIC_ORIGIN=https://project-1-kxxnvq.fly.dev
# Exactly one machine: rate limiting is in memory and SQLite is single-writer.


app = 'project-1-kxxnvq'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  TV_AUTO_SEED = '1'
  TV_DATA_DIR = '/data'
  TV_TRUST_PROXY = '1'

[[mounts]]
  source = 'trustvault_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
